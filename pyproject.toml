[project]
name = "agentkit"
version = "0.1.0"
description = "Basic building block of future LLM apps"
readme = "README.md"
authors = [
    { name = "Mahdi Bandegani", email = "mahdibandegani@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.7",
    "langfuse>=4.16.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
chroma = ["langchain-chroma"]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: tests requiring external services or API credentials",
]
filterwarnings = [
    "ignore::DeprecationWarning:langsmith.*",
    "ignore::DeprecationWarning:google.genai.*",
]